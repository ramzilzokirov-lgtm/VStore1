plugins { id 'com.android.application' }

android {
    buildFeatures { buildConfig true }
    buildTypes {
        debug { minifyEnabled false }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    namespace 'com.vstore.app'
    compileSdk 35
    defaultConfig {
        applicationId 'com.vstore.app'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
        buildConfigField "String", "DEVELOPER_KEY_SHA256", "\"${project.findProperty('developerKeySha256') ?: ''}\""
    }
}