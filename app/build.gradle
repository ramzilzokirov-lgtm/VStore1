plugins { id 'com.android.application' }

android {
    buildFeatures { buildConfig true }
    namespace 'com.vstore.app'
    compileSdk 35
    defaultConfig {
        applicationId 'com.vstore.app'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
        buildConfigField "String", "DEVELOPER_KEY_SHA256", "\"${project.findProperty('developerKeySha256') ?: ''}\""
    }
}