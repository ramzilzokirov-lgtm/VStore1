name: V Store Android Build
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Build optimized release APK
        run: gradle --no-daemon assembleRelease
      - name: Calculate APK checksums
        run: |
          cd app/build/outputs/apk
          sha256sum debug/*.apk release/*.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: v-store-apks
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/SHA256SUMS.txt
          if-no-files-found: error
