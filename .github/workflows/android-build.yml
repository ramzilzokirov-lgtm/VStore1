name: V Store Android Build
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Launch app on Android emulator
        id: smoke
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          profile: pixel_2
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -no-audio -no-boot-anim -camera-back none -gpu swiftshader_indirect
          disable-animations: false
          script: |
            set -eu
            mkdir -p artifacts
            adb start-server
            adb wait-for-device
            for attempt in $(seq 1 30); do state="$(adb get-state 2>/dev/null || true)"; boot="$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)"; if [ "$state" = "device" ] && [ "$boot" = "1" ]; then break; fi; sleep 2; done
            boot="$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)"; test "$boot" = "1" || { echo "Android emulator did not finish booting within 60 seconds."; adb devices -l || true; exit 1; }
            adb devices -l | tee artifacts/adb-devices.txt
            test "$(adb get-state)" = "device"
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell am force-stop com.vstore.app || true
            adb shell monkey -p com.vstore.app 1 || true
            app_alive=0
            for attempt in $(seq 1 15); do adb logcat -d -v threadtime > artifacts/vstore-startup-logcat.txt || true; if grep -q -E 'FATAL EXCEPTION.*com.vstore.app|Process: com.vstore.app|VStoreStartup.*E ' artifacts/vstore-startup-logcat.txt; then grep -n -A 80 -B 20 -E 'FATAL EXCEPTION|AndroidRuntime|VStoreStartup|Process: com.vstore.app' artifacts/vstore-startup-logcat.txt || true; exit 1; fi; if adb shell pidof com.vstore.app >/dev/null 2>&1; then app_alive=1; break; fi; sleep 2; done
            test "$app_alive" = "1" || { echo "V Store process not detected after launch."; adb get-state || true; grep -n -A 80 -B 20 -E 'FATAL EXCEPTION|AndroidRuntime|VStoreStartup|Process: com.vstore.app' artifacts/vstore-startup-logcat.txt || true; exit 1; }
            echo "V Store process remained alive after launch."
      - name: Upload startup diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v-store-startup-diagnostics
          path: artifacts/
          if-no-files-found: ignore
      - name: Build optimized release APK
        run: gradle --no-daemon assembleRelease
      - name: Prepare APKs and checksums
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/*.apk dist/VStore-debug.apk
          cp app/build/outputs/apk/release/*.apk dist/VStore-release.apk
          (cd dist && sha256sum VStore-debug.apk VStore-release.apk > SHA256SUMS.txt)
      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: v-store-apks
          path: dist/*
          if-no-files-found: error

  publish-release:
    needs: build
    if: github.event_name == 'workflow_dispatch' && github.actor == 'ramzilzokirov-lgtm'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download built APKs
        uses: actions/download-artifact@v4
        with:
          name: v-store-apks
          path: dist
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: vstore-${{ github.run_number }}
        run: |
          gh release create "$TAG_NAME" dist/VStore-debug.apk dist/VStore-release.apk dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --title "V Store build ${{ github.run_number }}" \
            --notes "Automated V Store APK build. Commit: ${{ github.sha }}"
